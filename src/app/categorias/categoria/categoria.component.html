<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
    <h2 class="text-2xl font-semibold text-gray-700 mg-4">Nova Categoria</h2>
    <hr/>
    <form id="categoriaForm" action="" [formGroup]="camposForm" (ngSubmit)="salvar()">
        <div class="mb-4">
            <label for="nome" class="block text-gray-700 font-medium mb-2">Nome</label>
            <input type="text" 
            id="nome" 
            formControlName="nome" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-200">
            <span class="text-red-500 text-sm" *ngIf="camposInvalidos('nome')">Campo Obrigatório</span>
        </div>
        <div class="mb-4">
            <label for="descricao" class="block text-gray-700 font-medium mb-2">Descrição</label>
            <textarea id="descricao" 
            rows="4" 
            formControlName="descricao" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-200"></textarea>
            <span class="text-red-500 text-sm" *ngIf="camposInvalidos('descricao')">Campo Obrigatório</span>
        </div>

        <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition duration-200">Salvar</button>
    </form>
</div>
