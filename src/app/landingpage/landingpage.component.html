<div class="bg-gradient-to-r from-blue-500 to-blue-700 text-white min-h-screen flex items-center justify-center">
  <div class="text-center px-6">
    <h1 class="text-4xl font-bold mb-4">Bem-vindo ao Passeio App!</h1>
    <p class="text-lg mb-8">Descubra os melhores passeios e experiências</p>
    <button (click)="navegarParaGaleria()" *ngIf="isLoggedIn()" class="bg-white text-blue-700 px-6 py-3 rounded-full font-semibold hover:bg-gray-200 transition duration-300">
      Venha explorar {{profile?.name}}
    </button>
    <button (click)="logarComGoogle()" *ngIf="!isLoggedIn()" class="bg-white text-blue-700 px-6 py-3 rounded-full font-semibold hover:bg-gray-200 transition duration-300 ml-4">
      <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="Google Logo" class="w-5 h-5 mr-2 inline-block" /> 
      Entrar com Google
    </button>
  </div>
</div>
